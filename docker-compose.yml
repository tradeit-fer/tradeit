
services:
  db:
    image: postgres:16
    container_name: webapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
